<script>
// Code Templates for Live Demos
const templates = {
    selection: `DECLARE score : INTEGER\nscore ← 85\n\nIF score >= 80 THEN\n    OUTPUT "Grade: Distinction"\nELSE\n    OUTPUT "Grade: Pass"\nENDIF`,
    loops: `DECLARE total : INTEGER\nDECLARE i : INTEGER\ntotal ← 0\n\nFOR i ← 1 TO 5\n    total ← total + i\n    OUTPUT "Sum at step ", i, " is: ", total\nNEXT i`,
    arrays: `DECLARE names : ARRAY[1:3] OF STRING\nnames[1] ← "Alice"\nnames[2] ← "Bob"\nnames[3] ← "Charlie"\n\nFOR i ← 1 TO 3\n    OUTPUT "Student ", i, " is ", names[i]\nNEXT i`,
    strings: `DECLARE msg : STRING\nmsg ← "Cambridge Pseudocode"\n\nOUTPUT "Original: ", msg\nOUTPUT "Length: ", LENGTH(msg)\nOUTPUT "Upper Case: ", UCASE(msg)`,
    files: `// File Operations Concept\nOPENFILE "results.txt" FOR WRITE\nWRITEFILE "results.txt", "Pass"\nCLOSEFILE "results.txt"\n\nOUTPUT "File saved successfully."`
};

function loadTemplate() {
    const key = document.getElementById('templateSelect').value;
    document.getElementById('codeEditor').value = templates[key];
}

function logOutput(msg) {
    const logsDiv = document.getElementById('logs');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = msg;
    logsDiv.appendChild(entry);
    logsDiv.parentElement.scrollTop = logsDiv.parentElement.scrollHeight;
}

function clearConsole() {
    document.getElementById('logs').innerHTML = '';
}

function updateInspector(variables) {
    const tableBody = document.getElementById('variableTable');
    tableBody.innerHTML = '';
    for (let [key, value] of Object.entries(variables)) {
        let displayVal = typeof value === 'object' ? JSON.stringify(value) : value;
        tableBody.innerHTML += `<tr><td>${key}</td><td>${displayVal}</td></tr>`;
    }
}

// Improved Interpreter with Dynamic INPUT & Variable State Resolution
function runSimulation() {
    clearConsole();
    const rawCode = document.getElementById('codeEditor').value;
    const lines = rawCode.split('\n');
    let variables = {};

    try {
        lines.forEach((line) => {
            let trimmed = line.trim();
            if (trimmed.startsWith('//') || trimmed === '') return;

            // 1. DECLARE Statement
            if (trimmed.startsWith('DECLARE')) {
                let content = trimmed.replace('DECLARE', '').trim();
                let parts = content.split(':');
                let varNames = parts[0].split(',').map(v => v.trim());
                
                varNames.forEach(varName => {
                    variables[varName] = 'UNINITIALIZED';
                });
            }
            
            // 2. INPUT Statement
            else if (trimmed.startsWith('INPUT')) {
                let varName = trimmed.replace('INPUT', '').trim();
                let userInput = prompt(`[INPUT REQUIRED]\nEnter value for variable '${varName}':`);
                
                if (userInput !== null) {
                    // Auto-cast numbers if valid
                    if (!isNaN(userInput) && userInput.trim() !== '') {
                        variables[varName] = Number(userInput);
                    } else {
                        variables[varName] = userInput;
                    }
                    logOutput(` > INPUT ${varName} = ${variables[varName]}`);
                } else {
                    variables[varName] = 'CANCELLED';
                }
            }

            // 3. ASSIGNMENT Statement (← or <-)
            else if (trimmed.includes('←') || trimmed.includes('<-')) {
                let parts = trimmed.split(/←|<-/);
                let varName = parts[0].trim();
                let expr = parts[1].trim();

                // String built-in function replacements
                expr = expr.replace(/LENGTH\((.*?)\)/g, (m, p1) => {
                    let val = variables[p1.trim()] !== undefined ? variables[p1.trim()] : p1.trim();
                    return String(val).replace(/"/g, '').length;
                });
                expr = expr.replace(/UCASE\((.*?)\)/g, (m, p1) => {
                    let val = variables[p1.trim()] !== undefined ? variables[p1.trim()] : p1.trim();
                    return `"${String(val).replace(/"/g, '').toUpperCase()}"`;
                });

                // Substitute declared variable names with current values in expression
                Object.keys(variables).forEach(v => {
                    if (variables[v] !== 'UNINITIALIZED') {
                        let reg = new RegExp(`\\b${v}\\b`, 'g');
                        let val = typeof variables[v] === 'string' ? `"${variables[v]}"` : variables[v];
                        expr = expr.replace(reg, val);
                    }
                });

                try {
                    let val = Function('"use strict"; return (' + expr + ')')();
                    variables[varName] = val;
                } catch (e) {
                    variables[varName] = expr.replace(/"/g, '');
                }
            }

            // 4. OUTPUT Statement
            else if (trimmed.startsWith('OUTPUT')) {
                let content = trimmed.replace('OUTPUT', '').trim();
                
                // Parse comma-separated output values
                let elements = content.split(',').map(e => {
                    let clean = e.trim();
                    if (clean.startsWith('"') && clean.endsWith('"')) {
                        return clean.slice(1, -1);
                    }
                    return variables[clean] !== undefined ? variables[clean] : clean;
                });
                
                logOutput(" > " + elements.join(' '));
            }
        });

        updateInspector(variables);
    } catch (err) {
        logOutput("Execution Error: " + err.message);
    }
}

function syncCodeSubmission() {
    document.getElementById('hiddenCodeInput').value = document.getElementById('codeEditor').value;
}

window.onload = loadTemplate;
</script>
